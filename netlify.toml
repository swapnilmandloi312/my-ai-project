# Standalone research-site release. Do not change an existing unrelated site's repository without owner approval.
[build]
  command = "python scripts/build_public_site.py"
  publish = "dist-public"

[[headers]]
  for = "/apps/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/apps/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
