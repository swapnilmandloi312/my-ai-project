[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "swapnil-ai-labs-research"
version = "0.7.0"
description = "Experimental offline intelligence platform"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
swapnil-ai-labs-demo = "swapnil_ai_labs.demo:main"
swapnil-ai-labs-engineering-demo = "swapnil_ai_labs.engineering_demo:main"

[tool.setuptools.packages.find]
include = ["swapnil_ai_labs*", "intelligence*"]
