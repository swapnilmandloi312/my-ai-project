name: Research core tests
on:
  pull_request:
  push:
    branches: [swapnil-ai-labs-research-v0.2]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest -v test_agent_language.py
      - run: python -m unittest discover -v -s tests
      - run: python -m integrations.pilot
      - run: python research/verify_evidence.py
