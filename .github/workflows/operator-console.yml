name: Local operator console acceptance
on:
  pull_request:
    paths:
      - 'swapnil_ai_labs/operator_console.py'
      - 'swapnil_ai_labs/test_operator_console.py'
      - '.github/workflows/operator-console.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v swapnil_ai_labs.test_operator_console swapnil_ai_labs.test_goal_broker swapnil_ai_labs.test_goal_queue
