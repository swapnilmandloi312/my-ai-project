name: Forty profile acceptance
on:
  pull_request:
    paths:
      - 'swapnil_ai_labs/forty_profiles.py'
      - 'swapnil_ai_labs/test_forty_profiles.py'
      - '.github/workflows/forty-profiles.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v swapnil_ai_labs.test_forty_profiles
