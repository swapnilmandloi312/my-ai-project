name: Public applications acceptance
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/apps-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node website/apps/test-engine.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.51.1
      - run: npx playwright install chromium --with-deps
      - run: node website/apps/test-browser.mjs
      - name: Assemble static release
        run: |
          mkdir -p static-release
          cp -r website/. static-release/
          cp LICENSE static-release/LICENSE
          cp THIRD_PARTY_NOTICES.md static-release/THIRD_PARTY_NOTICES.md
          rm -f static-release/apps/test-browser.mjs static-release/apps/test-engine.mjs
          python -m zipfile -c swapnil-ai-labs-static-preview.zip static-release
      - uses: actions/upload-artifact@v4
        with:
          name: static-apps-release
          path: |
            static-release/
            apps-mobile-preview.png
            swapnil-ai-labs-static-preview.zip
