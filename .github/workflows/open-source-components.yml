name: Open source component checks
on:
  pull_request:
    paths:
      - 'intelligence/**'
      - 'swapnil_ai_labs/**'
      - 'LICENSE'
      - '.github/workflows/open-source-components.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v intelligence.test_future_components intelligence.test_components intelligence.test_authorized_store swapnil_ai_labs.test_platform swapnil_ai_labs.test_engineering
      - run: python -m swapnil_ai_labs.engineering_demo
