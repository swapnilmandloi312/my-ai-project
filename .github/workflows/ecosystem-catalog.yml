name: Global ecosystem catalog checks
on:
  pull_request:
    paths:
      - 'ecosystem/**'
      - '.github/workflows/ecosystem-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest -v ecosystem.test_catalog
      - run: python -m ecosystem.discover --industry agriculture
