name: Hourly scoped synthetic worker
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Worker queue
        type: choice
        options:
          - synthetic
          - evidence-canary
          - operations-canary
        default: synthetic
permissions:
  contents: read
concurrency:
  group: swapnil-ai-labs-hourly-worker
  cancel-in-progress: false
jobs:
  worker:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'evidence-canary' || inputs.mode == 'operations-canary')) ||
       vars.SWAPNIL_WORKER_ENABLED == 'true' ||
       (github.event_name == 'schedule' && (vars.SWAPNIL_EVIDENCE_HOURLY == 'true' || vars.SWAPNIL_OPERATIONS_HOURLY == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run bounded approved jobs
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          EVIDENCE_SCHEDULES: ${{ vars.SWAPNIL_EVIDENCE_SCHEDULES }}
          EVIDENCE_HOURLY: ${{ vars.SWAPNIL_EVIDENCE_HOURLY }}
          OPERATIONS_HOURLY: ${{ vars.SWAPNIL_OPERATIONS_HOURLY }}
          SAL_GITHUB_READ_TOKEN: ${{ github.token }}
          PGHOST: ${{ secrets.SAL_WORKER_PGHOST }}
          PGUSER: ${{ secrets.SAL_WORKER_PGUSER }}
          PGPASSWORD: ${{ secrets.SAL_WORKER_PGPASSWORD }}
          WORKER_CA: ${{ secrets.SAL_WORKER_CA_PEM }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '8'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PGHOST" && test -n "$PGUSER" && test -n "$PGPASSWORD" && test -n "$WORKER_CA"
          case "$PGUSER" in sal_hourly_worker|sal_hourly_worker.*) ;; *) exit 1 ;; esac
          umask 077
          ca="$(mktemp)"
          trap 'rm -f "$ca"' EXIT
          printf '%s\n' "$WORKER_CA" > "$ca"
          unset WORKER_CA
          export PGSSLROOTCERT="$ca"
          if [[ "$REQUESTED_MODE" == evidence-canary ]]; then
            python3 -m swapnil_ai_labs.evidence_worker --public-github --batch 1
          elif [[ "$REQUESTED_MODE" == operations-canary ]]; then
            env -u SAL_GITHUB_READ_TOKEN python3 -m swapnil_ai_labs.evidence_worker --operations --batch 1
          elif [[ "$EVENT_NAME" == schedule && ( "$EVIDENCE_HOURLY" == true || "$OPERATIONS_HOURLY" == true ) ]]; then
            batch=4
            if [[ "$EVIDENCE_HOURLY" == true && "$OPERATIONS_HOURLY" == true ]]; then
              batch=2
            fi
            if [[ "$EVIDENCE_HOURLY" == true ]]; then
              if [[ "$EVIDENCE_SCHEDULES" == true ]]; then
                psql -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT sal_ops.materialize_github_evidence_schedules()' >/dev/null
              fi
              python3 -m swapnil_ai_labs.evidence_worker --public-github --batch "$batch"
            fi
            if [[ "$OPERATIONS_HOURLY" == true ]]; then
              env -u SAL_GITHUB_READ_TOKEN python3 -m swapnil_ai_labs.evidence_worker --operations --batch "$batch"
            fi
          else
            unset SAL_GITHUB_READ_TOKEN
            python3 -m swapnil_ai_labs.cloud_worker --scoped --batch 20 --record-run "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          fi
