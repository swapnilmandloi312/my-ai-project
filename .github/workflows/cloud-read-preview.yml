name: Cloud read preview tests
on:
  pull_request:
    paths:
      - 'control-center/**'
      - '.github/workflows/cloud-read-preview.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node control-center/test.mjs
      - run: node control-center/cloud-test.mjs
      - run: node --check control-center/cloud.mjs

      - run: node --check control-center/queue-ui.mjs
