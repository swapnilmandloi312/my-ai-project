name: Portable package preview
on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'swapnil_ai_labs/**'
      - 'intelligence/**'
      - '.github/workflows/package-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build==1.2.2.post1
      - run: python -m build --wheel
      - name: Test wheel independently of source directory
        run: |
          python -m venv /tmp/research-preview
          /tmp/research-preview/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/research-preview/bin/swapnil-ai-labs-demo
      - run: sha256sum dist/*.whl > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-wheel-preview
          path: dist/
