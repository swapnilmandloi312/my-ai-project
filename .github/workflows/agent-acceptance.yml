name: Agent evidence acceptance
on:
  pull_request:
    paths:
      - 'docs/AGENT_ACCEPTANCE_MATRIX.md'
      - 'swapnil_ai_labs/**'
      - '.github/workflows/agent-acceptance.yml'
permissions:
  contents: read
jobs:
  local-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest -v swapnil_ai_labs.test_agent_acceptance
