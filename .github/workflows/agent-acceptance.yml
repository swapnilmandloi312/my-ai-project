name: Agent evidence acceptance
on:
  pull_request:
    paths:
      - 'docs/AGENT_ACCEPTANCE_MATRIX.md'
      - 'swapnil_ai_labs/**'
      - '.github/workflows/agent-acceptance.yml'
permissions:
  contents: read
jobs:
  local-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest -v swapnil_ai_labs.test_agent_acceptance swapnil_ai_labs.test_evidence_tools
      - name: Read the approved public repository
        env:
          SAL_GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from swapnil_ai_labs.evidence_tools import encode_deliverable, execute_read_only
          revision = "42f3324fc53319252c79081243ba54d50893bb15"
          for category in ("engineering", "technical_writing"):
              result = execute_read_only(
                  category, "git_revision", {"source_revision": revision}, public_github=True,
              )
              assert result["source_evidence"]["commit"] == revision
              assert encode_deliverable(result)
              print(f"{category}: public GitHub evidence verified")
          PY
