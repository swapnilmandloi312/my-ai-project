name: Founder control center acceptance
on:
  pull_request:
    paths:
      - 'control-center/**'
      - '.github/workflows/control-center.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node control-center/test.mjs
      - run: node --input-type=module --check < control-center/app.js
