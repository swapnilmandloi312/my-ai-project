name: Container staging acceptance
on:
  pull_request:
    paths:
      - 'deployment/**'
      - 'secure_service/**'
      - '.dockerignore'
      - '.github/workflows/staging-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python deployment/staging_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-evidence
          path: staging-results.json
