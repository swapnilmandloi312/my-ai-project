name: Developer integration smoke tests
on:
  pull_request:
    paths:
      - 'integrations/**'
      - '.github/workflows/developer-integrations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m integrations.test_sdk
      - run: pip install mcp==1.30.0
      - run: python -m integrations.test_mcp_stdio
      - run: python -m unittest -v integrations.test_bound_proposal
      - run: python research/replay_model_outputs.py
