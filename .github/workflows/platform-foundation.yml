name: Integrated platform foundation
on:
  pull_request:
    paths:
      - 'swapnil_ai_labs/**'
      - 'schemas/**'
      - 'research/evidence_manifest.py'
      - '.github/workflows/platform-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest -v swapnil_ai_labs.test_platform
      - run: python -m swapnil_ai_labs.demo
      - run: python research/evidence_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: research-evidence-manifest
          path: evidence-manifest.json
