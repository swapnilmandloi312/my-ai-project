name: Research proposal
description: Propose a reproducible experiment or integration
title: "[Research]: "
body:
  - type: textarea
    id: question
    attributes:
      label: Hypothesis and use case
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Prior art, baseline and acceptance metrics
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Data rights, test plan, limitations
    validations:
      required: true
